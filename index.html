<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIPPOA Badulla District Digital Membership</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f8f3;color:#16301c}.top{background:linear-gradient(135deg,#116b2a,#2f9e44);color:white;padding:16px;text-align:center}.logo{width:82px;height:82px;object-fit:contain;border-radius:50%;background:white;padding:3px;margin-bottom:8px}.top h1{margin:0;font-size:24px}.top p{margin:6px 0 0;opacity:.9}.wrap{max-width:1050px;margin:24px auto;padding:0 15px}.search{width:100%;padding:14px;border:1px solid #c8d3df;border-radius:12px;font-size:16px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.member{background:white;border-radius:16px;padding:18px;box-shadow:0 4px 18px #00000012}.member h3{margin:0 0 8px;font-size:18px}.muted{color:#64748b;font-size:13px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#176b2c;color:white;cursor:pointer;margin-top:12px}.card{display:none;max-width:430px;margin:20px auto;background:linear-gradient(135deg,#145c28,#43a047);color:white;border-radius:22px;padding:20px;box-shadow:0 10px 30px #0003}.card.show{display:block}.cardhead{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:15px}.photo{width:82px;height:100px;object-fit:cover;border-radius:10px;border:2px solid white;background:#ddd}.details{margin-top:16px}.details h2{font-size:20px;margin:0 0 4px}.details p{margin:6px 0;font-size:13px}.qrbox{background:white;padding:8px;border-radius:8px;width:98px;height:98px;margin-top:14px}.close{float:right;background:#fff;color:#176b2c}.verify{margin-top:20px;background:white;border-radius:16px;padding:18px}.verify input{width:100%;padding:12px;border:1px solid #ccd6e0;border-radius:10px}.status{margin-top:10px;font-weight:700}.footer{text-align:center;color:#64748b;font-size:12px;padding:30px}</style></head><body><header class="top"><img class="logo" src="aippoa-badulla-logo.jpg" alt="AIPPOA Badulla District Logo"><h1>AIPPOA SRI LANKA</h1><p>Badulla District • Digital Membership ID</p></header><main class="wrap"><input id="search" class="search" placeholder="Search member name, pharmacy or membership number..."><section id="grid" class="grid"></section><section id="card" class="card"><button class="btn close" onclick="hideCard()">Close</button><div class="cardhead"><div><img src="aippoa-badulla-logo.jpg" style="width:42px;height:42px;object-fit:contain;border-radius:50%;background:white;padding:2px;vertical-align:middle;margin-right:8px"><span class="brand">AIPPOA BADULLA DISTRICT</span></div><div id="mid"></div></div><div style="display:flex;gap:15px;margin-top:18px"><img id="photo" class="photo"><div class="details"><h2 id="name"></h2><p id="pharmacy"></p><p id="address"></p><p><b>Membership:</b> <span id="membership"></span></p></div></div><div id="qr" class="qrbox"></div><p style="font-size:11px;margin-bottom:0">Scan QR to verify membership.</p></section><section class="verify"><h3>Membership Verification</h3><input id="verifyInput" placeholder="Enter Membership Number (e.g. BD2008)"><button class="btn" onclick="verify()">Verify</button><div id="status" class="status"></div></section></main><div class="footer">AIPPOA Badulla District • Digital ID prototype</div><script>let members=[];const grid=document.getElementById('grid');fetch('members.json').then(r=>r.json()).then(d=>{members=d;render(d)});function render(list){grid.innerHTML=list.map(m=>`<article class="member"><h3>${esc(m.name)}</h3><div class="muted">${esc(m.pharmacy)}</div><p><b>Membership:</b> ${esc(m.membership)}</p><button class="btn" onclick="showCard('${m.membership}')">View Digital ID</button></article>`).join('')}document.getElementById('search').oninput=e=>{let q=e.target.value.toLowerCase();render(members.filter(m=>[m.name,m.pharmacy,m.membership].some(x=>String(x).toLowerCase().includes(q))))};function showCard(id){let m=members.find(x=>x.membership===id);if(!m)return;document.getElementById('card').classList.add('show');document.getElementById('name').textContent=m.name;document.getElementById('pharmacy').textContent=m.pharmacy;document.getElementById('address').textContent=m.address;document.getElementById('membership').textContent=m.membership;document.getElementById('mid').textContent='#'+m.membership;document.getElementById('photo').src=m.photo;document.getElementById('qr').innerHTML='';new QRCode(document.getElementById('qr'),{text:location.href.split('?')[0]+'?verify='+encodeURIComponent(m.membership),width:82,height:82});document.getElementById('card').scrollIntoView({behavior:'smooth'})}function hideCard(){document.getElementById('card').classList.remove('show')}function verify(){let id=document.getElementById('verifyInput').value.trim().toUpperCase();let m=members.find(x=>String(x.membership).toUpperCase()===id);let s=document.getElementById('status');if(m){s.textContent='✓ Valid member: '+m.name+' — '+m.pharmacy;s.style.color='green';showCard(m.membership)}else{s.textContent='Membership number not found.';s.style.color='crimson'}}function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}const params=new URLSearchParams(location.search);if(params.get('verify'))setTimeout(()=>verifyFromQR(params.get('verify')),700);function verifyFromQR(id){let m=members.find(x=>String(x.membership).toUpperCase()===String(id).toUpperCase());let s=document.getElementById('status');if(m){s.innerHTML='✓ <b>VALID AIPPOA MEMBERSHIP</b><br><span style="font-weight:600">'+esc(m.name)+'</span><br>'+esc(m.pharmacy)+'<br>Membership No: '+esc(m.membership);s.style.color='green';document.getElementById('verifyInput').value=m.membership;showCard(m.membership)}else{s.textContent='Membership number not found.';s.style.color='crimson'}}</script></body></html>
